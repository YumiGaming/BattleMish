<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo de Hoja de Cuaderno Cuadriculado con bordes redondeados -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="11" ry="11" fill="#fdfbf7" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Cuadrícula tenue -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="15" y1="3" x2="15" y2="61"/>
    <line x1="27" y1="3" x2="27" y2="61"/>
    <line x1="39" y1="3" x2="39" y2="61"/>
    <line x1="51" y1="3" x2="51" y2="61"/>
    <line x1="3" y1="15" x2="61" y2="15"/>
    <line x1="3" y1="27" x2="61" y2="27"/>
    <line x1="3" y1="39" x2="61" y2="39"/>
    <line x1="3" y1="51" x2="61" y2="51"/>
  </g>
  
  <!-- Margen rojo de cuaderno -->
  <line x1="14" y1="3" x2="14" y2="61" stroke="#f87171" stroke-width="1.5"/>
  
  <!-- Barco de Guerra BattleMish -->
  <!-- Cabina izquierda -->
  <rect x="20" y="23" width="12" height="12" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Mástil izquierdo -->
  <line x1="26" y1="16" x2="26" y2="23" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Cabina derecha -->
  <rect x="34" y="18" width="12" height="17" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Mástil derecho -->
  <line x1="40" y1="10" x2="40" y2="18" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Banderín rojo -->
  <polygon points="40,10 49,14 40,18" fill="#dc2626"/>
  
  <!-- Casco del barco -->
  <polygon points="7,35 57,35 48,46 16,46" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.2" stroke-linejoin="round"/>
  
  <!-- Olas de agua / trazo doodle -->
  <path d="M 9,51 Q 21,48 33,51 Q 45,48 55,51" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
</svg>
